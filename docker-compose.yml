services:
  nami:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nami_app
    restart: unless-stopped
    ports:
      # Format: "HOST_PORT:CONTAINER_PORT"
      # Host port 8070 maps to container port 8080 (evite les conflits avec Pi-hole/Lighttpd)
      - "8070:8080"
    volumes:
      # Data directory for persistent app settings & downloads database
      - ./data:/app/data
      # Montage de votre disque dur externe ou dossier cible
      # Exemple pour votre disque externe: - /media/tmcooper/Elements:/downloads
      - ./downloads:/downloads
      # Catalogues et caches des APIs (sinon perdus a chaque reconstruction du conteneur)
      - ./data/apis/animesama:/app/AnimeSamaApi/src/data
      - ./data/apis/voiranime:/app/voiranime_API/data
    environment:
      - PYTHONUNBUFFERED=1
